<script>

function loadOrder(){

    let box = document.getElementById("orderSummary");

    if(!box) return;

    box.innerHTML = "";

    let total = 0;

    cart.forEach(item=>{

        let itemTotal = item.price * item.quantity;

        total += itemTotal;

        box.innerHTML += `
        <div class="cart-item">
            <h4>${item.name}</h4>
            <p>
                ${item.quantity} × ${item.price} EGP
            </p>
        </div>
        `;
    });

    document.getElementById("total").innerText =
    "الإجمالي: " + total + " EGP";
}
